[tools]
just = "1.58.0"
python = "3.12.14"
uv = "latest"
node = "24.7.0"
pnpm = "11.10.0"
"conda:ffmpeg" = "8.1.2"

[settings]
idiomatic_version_file_enable_tools = ["python"]
python.uv_venv_auto = "create|source"

[env]
# requirements-based setup has no uv.lock for uv_venv_auto to discover.
_.python.venv = { path = ".venv", create = true }
