version = 1
# Select the only visible player, whether P1 or P2. Use --player to override.
player = "single"
title = "{timestamp} {song}{chart_suffix}"

[[details]]
text = "P {player.perfect} / G {player.great} / Good {player.good} / Bad {player.bad} / Miss {player.miss}"
missing = "show"

[[details]]
text = "Score {player.score} · Max combo {player.max_combo}"
missing = "omit"

[[rules]]
title = "{timestamp} {song}{chart_suffix} — All judgments perfect"
when.all = [
  { field = "player.perfect", op = "gt", value = 0 },
  { field = "player.great", op = "eq", value = 0 },
  { field = "player.good", op = "eq", value = 0 },
  { field = "player.bad", op = "eq", value = 0 },
  { field = "player.miss", op = "eq", value = 0 },
]

[[rules]]
title = "{timestamp} {song}{chart_suffix} — Miss {player.miss}"
when = { field = "player.miss", op = "gt", value = 0 }
