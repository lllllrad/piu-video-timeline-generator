[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "piu-video-timeline"
version = "0.1.0"
description = "Evidence-backed Pump It Up video timeline analysis"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"piu_timeline.play" = ["report.html", "report.css", "report.js", "report-evidence.js", "inspector/*.js", "inspector/*.css"]
"piu_timeline.derived" = ["*.ts", "*.json", "beats/*.ts", "charts/*.ts", "pipeline/*.ts"]
